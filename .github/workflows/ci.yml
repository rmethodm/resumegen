name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests & Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test --compact

      - name: Check code style
        run: ./vendor/bin/pint --test

  deploy:
    name: Deploy to production
    needs: test
    # ponytail: required-reviewer environment protection needs GitHub Team; this
    # is a free-plan substitute — deploy only fires when manually triggered
    # (Actions tab "Run workflow" or `gh workflow run ci.yml`), never on a bare push.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Self-hosted runner living on the production box itself (resumegen-prod
    # label, registered as the github-runner system user). GitHub-hosted
    # runners can't reach this server -- Hostinger's network firewall drops
    # SSH connections from GitHub Actions runner IPs before they reach sshd.
    # Running the job locally sidesteps that: no SSH/rsync needed, deploy.sh
    # already pulls/builds/migrates itself. github-runner has exactly one
    # narrowly-scoped sudo rule (/etc/sudoers.d/github-runner) permitting only
    # this one script as root -- nothing broader.
    runs-on: [self-hosted, resumegen-prod]
    environment: production

    steps:
      - name: Run deploy script
        run: sudo /var/www/resumegen.app/deploy.sh
